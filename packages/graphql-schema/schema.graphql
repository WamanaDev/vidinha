# Vidinha — SDL GraphQL (fonte única)
#
# GERADO AUTOMATICAMENTE a partir do código code-first de apps/api
# (@nestjs/graphql) via `pnpm --filter api run schema:generate`.
# NÃO editar manualmente — qualquer alteração deve ser feita nos
# resolvers/entities/dto de apps/api/src e regerada.
#
# Fonte única do contrato GraphQL entre apps/api e apps/mobile — ver
# specs/backend/00-overview.md §6 (versionamento do schema).

type User implements Node {
  id: ID!
  email: String!
  displayName: String
  avatarUrl: String
  mfaEnabled: Boolean!
  createdAt: DateTime!
}

interface Node {
  id: ID!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type DataExportPayload {
  downloadUrl: String!
  expiresAt: DateTime!
}

type FamilyMembership implements Node {
  id: ID!
  family: Family!
  user: User!
  role: FamilyRole!
  joinedAt: DateTime!
}

enum FamilyRole {
  ADMIN
  MEMBER
}

type Family implements Node {
  id: ID!
  name: String!
  createdAt: DateTime!
  members: [FamilyMembership!]!
  myRole: FamilyRole!
}

type FamilyInvite implements Node {
  id: ID!
  family: Family!
  email: String!
  invitedBy: User!
  status: InviteStatus!
  expiresAt: DateTime!
}

enum InviteStatus {
  PENDING
  ACCEPTED
  EXPIRED
  REVOKED
  DECLINED
}

type FamilyPayload {
  family: Family!
}

type FamilyInvitePayload {
  invite: FamilyInvite!
}

type Account implements Node {
  id: ID!
  name: String!
  type: AccountType!
  balance: Float!
  currency: String!
  connection: OpenFinanceConnection
  sharedWithFamily: Boolean!
  fullDetailShared: Boolean!
  owner: User!
}

enum AccountType {
  CHECKING
  SAVINGS
  INVESTMENT
  OTHER
}

type OpenFinanceConnection {
  id: ID!
  institutionName: String!
  institutionLogoUrl: String
  status: ConnectionStatus!
  lastSyncedAt: DateTime
  createdAt: DateTime!
  accounts: [Account!]!
}

enum ConnectionStatus {
  CONNECTED
  UPDATING
  LOGIN_ERROR
  OUTDATED
  ERROR
  REVOKED
}

"""
Instituição financeira disponível para conexão direta via API do Pluggy
(substitui o antigo widget Pluggy Connect). Sempre buscado ao vivo em
GET /connectors — nunca persistido no Postgres.
"""
type OpenFinanceConnector {
  id: Int!
  name: String!
  imageUrl: String
  primaryColor: String
  """PERSONAL_BANK | BUSINESS_BANK | INVESTMENT | INVOICE | TELECOMMUNICATION | OTHER (string livre, ver ConnectorCredential.type)."""
  type: String!
  country: String!
  credentials: [ConnectorCredential!]!
  hasMFA: Boolean!
  oauth: Boolean!
  """Presente quando oauth = true. O app decide como tratar esse fluxo (ex.: WebView), sem endpoint de callback próprio por enquanto."""
  oauthUrl: String
  health: ConnectorHealth
  isOpenFinance: Boolean!
  isSandbox: Boolean!
}

"""Um campo de formulário exigido pelo Connector (dinâmico por banco)."""
type ConnectorCredential {
  name: String!
  label: String!
  """text | password | number | image | select (string livre, não fechado em enum — ver contrato do Pluggy)."""
  type: String!
  placeholder: String
  validation: String
  validationMessage: String
  optional: Boolean!
  instructions: String
  options: [ConnectorCredentialOption!]
}

type ConnectorCredentialOption {
  value: String!
  label: String!
}

type ConnectorHealth {
  """ONLINE | OFFLINE | UNSTABLE"""
  status: String!
}

"""Retorno de createOpenFinanceItem/sendOpenFinanceItemMfa."""
type OpenFinanceItemResult {
  connection: OpenFinanceConnection!
  """Id do Item na Pluggy (não o id de `connection`) — necessário para chamar sendOpenFinanceItemMfa quando mfaParameter vier preenchido."""
  pluggyItemId: String!
  status: String!
  executionStatus: String
  """Presente quando o Pluggy está aguardando um valor de MFA — descreve qual credencial pedir agora."""
  mfaParameter: ConnectorCredential
  """Presente em fluxos de device authorization (QR code / autorização no app do banco)."""
  userAction: OpenFinanceUserAction
  """Mensagem segura de erro (nunca inclui credenciais/stacktrace)."""
  errorMessage: String
}

type OpenFinanceUserAction {
  """Ex.: "qr" | "authorize-access"."""
  type: String!
  instructions: String!
  expiresAt: DateTime
}

type SharingPermission implements Node {
  id: ID!
  family: Family!
  owner: User!
  scope: SharingScope!
  targetId: ID!
  sharedWithFamily: Boolean!
  fullDetailShared: Boolean!
  updatedAt: DateTime!
}

enum SharingScope {
  ACCOUNT
  CARD
  CATEGORY
}

type Card implements Node {
  id: ID!
  name: String!
  lastFourDigits: String
  limit: Float
  currentInvoice: Float
  dueDate: DateTime
  sharedWithFamily: Boolean!
  owner: User!
}

type Category implements Node {
  id: ID!
  name: String!
  icon: String
  hiddenFromFamily: Boolean!
  isDefault: Boolean!
}

type Transaction implements Node {
  id: ID!
  description: String!
  amount: Float!
  date: DateTime!
  account: Account
  card: Card
  category: Category
  hiddenFromFamily: Boolean!
  owner: User!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type TransactionEdge {
  cursor: Cursor!
  node: Transaction!
}

"""Cursor opaco (base64) para paginação estilo Relay."""
scalar Cursor

type TransactionConnection {
  edges: [TransactionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type RecurringExpense implements Node {
  id: ID!
  family: Family!
  description: String!
  amount: Float!
  frequency: RecurrenceFrequency!
  nextDueDate: DateTime!
  category: Category
  sharedWithFamily: Boolean!
  owner: User!
}

enum RecurrenceFrequency {
  WEEKLY
  MONTHLY
  BIMONTHLY
  QUARTERLY
  SEMIANNUAL
  ANNUAL
}

type Query {
  me: User!
  family(id: ID!): Family!
  myFamilies: [FamilyMembership!]!
  """Lista instituições disponíveis para conexão direta via API (país fixo BR). includeSandbox default false."""
  openFinanceConnectors(includeSandbox: Boolean): [OpenFinanceConnector!]!
  openFinanceConnections(familyId: ID!): [OpenFinanceConnection!]!
  sharingPermissions(familyId: ID!): [SharingPermission!]!
  accounts(familyId: ID!): [Account!]!
  cards(familyId: ID!): [Card!]!
  transactions(filter: TransactionFilterInput!, orderBy: TransactionOrderInput, first: Int, after: Cursor): TransactionConnection!
  recurringExpenses(familyId: ID!): [RecurringExpense!]!
  categories(familyId: ID!): [Category!]!
}

input TransactionFilterInput {
  familyId: ID!
  accountId: ID
  cardId: ID
  categoryId: ID
  fromDate: DateTime
  toDate: DateTime
  minAmount: Float
  maxAmount: Float
}

input TransactionOrderInput {
  field: TransactionOrderField!
  direction: OrderDirection!
}

enum TransactionOrderField {
  DATE
  AMOUNT
}

enum OrderDirection {
  ASC
  DESC
}

type Mutation {
  completeUserProfile(input: CompleteProfileInput!): User!
  requestAccountDeletion: Boolean!
  exportMyData: DataExportPayload!
  createFamily(input: CreateFamilyInput!): FamilyPayload!
  inviteMember(input: InviteMemberInput!): FamilyInvitePayload!
  acceptInvite(input: AcceptInviteInput!): FamilyPayload!
  removeMember(input: RemoveMemberInput!): FamilyPayload!
  promoteMember(input: PromoteMemberInput!): FamilyPayload!
  leaveFamily(familyId: ID!): Boolean!
  deleteFamily(familyId: ID!): Boolean!
  """Cria a conexão bancária diretamente via API (formulário nativo, sem widget). Rate-limited (auth-sensitive)."""
  createOpenFinanceItem(input: CreateOpenFinanceItemInput!): OpenFinanceItemResult!
  """Envia o valor de MFA pedido pelo Pluggy para um item pendente. Rate-limited (auth-sensitive)."""
  sendOpenFinanceItemMfa(input: SendOpenFinanceItemMfaInput!): OpenFinanceItemResult!
  syncOpenFinanceConnection(connectionId: ID!): OpenFinanceConnection!
  revokeOpenFinanceConnection(connectionId: ID!): Boolean!
  updateSharingPermission(input: UpdateSharingPermissionInput!): SharingPermission!
  updateAccountSharing(input: UpdateAccountSharingInput!): Account!
  updateCardSharing(input: UpdateCardSharingInput!): Card!
  hideTransaction(input: HideTransactionInput!): Transaction!
  updateTransactionCategory(input: UpdateTransactionCategoryInput!): Transaction!
  createRecurringExpense(input: CreateRecurringExpenseInput!): RecurringExpense!
  updateRecurringExpense(input: UpdateRecurringExpenseInput!): RecurringExpense!
  deleteRecurringExpense(id: ID!): Boolean!
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
}

input CompleteProfileInput {
  displayName: String!
  avatarUrl: String
}

input CreateFamilyInput {
  name: String!
}

input InviteMemberInput {
  familyId: ID!
  email: String!
}

input AcceptInviteInput {
  inviteToken: String!
}

input RemoveMemberInput {
  familyId: ID!
  membershipId: ID!
}

input PromoteMemberInput {
  familyId: ID!
  membershipId: ID!
}

"""Um par nome/valor de credencial exigida pelo Connector (ConnectorCredential.name -> valor preenchido pelo usuário)."""
input CredentialParameterInput {
  name: String!
  value: String!
}

input CreateOpenFinanceItemInput {
  familyId: ID!
  connectorId: Int!
  """Nunca vazio — uma entrada por ConnectorCredential.name retornado por openFinanceConnectors."""
  parameters: [CredentialParameterInput!]!
}

input SendOpenFinanceItemMfaInput {
  """Item.id retornado por createOpenFinanceItem/sendOpenFinanceItemMfa anterior."""
  itemId: ID!
  parameters: [CredentialParameterInput!]!
}

input UpdateSharingPermissionInput {
  id: ID!
  sharedWithFamily: Boolean
  fullDetailShared: Boolean
}

input UpdateAccountSharingInput {
  accountId: ID!
  sharedWithFamily: Boolean!
  fullDetailShared: Boolean!
}

input UpdateCardSharingInput {
  cardId: ID!
  sharedWithFamily: Boolean!
}

input HideTransactionInput {
  transactionId: ID!
  hiddenFromFamily: Boolean!
}

input UpdateTransactionCategoryInput {
  transactionId: ID!
  categoryId: ID!
}

input CreateRecurringExpenseInput {
  familyId: ID!
  description: String!
  amount: Float!
  frequency: RecurrenceFrequency!
  dueDay: Int!
  startDate: DateTime!
  endDate: DateTime
  categoryId: ID
}

input UpdateRecurringExpenseInput {
  id: ID!
  description: String
  amount: Float
  frequency: RecurrenceFrequency
  dueDay: Int
  startDate: DateTime
  endDate: DateTime
  categoryId: ID
  isActive: Boolean
}

input CreateCategoryInput {
  familyId: ID!
  name: String!
  icon: String
}

input UpdateCategoryInput {
  id: ID!
  name: String
  icon: String
  hiddenFromFamily: Boolean
}